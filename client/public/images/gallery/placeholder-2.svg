<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!--
    KAYA KALPA — Placeholder de galería 2 de 4: la flor abierta.
    Ver el comentario de `placeholder-1.svg` para por qué son dibujos y no fotos.
  -->
  <title>Ilustración botánica de referencia</title>

  <defs>
    <!-- El pétalo, con la base en el origen y la punta hacia arriba. -->
    <path id="petalo" d="M0 0C50-70 50-170 0-240-50-170-50-70 0 0Z"/>
    <!-- La hoja, con la base en el origen y la punta hacia la derecha. -->
    <path id="hoja" d="M0 0C30-30 72-24 100 0 72 24 30 30 0 0Z"/>
  </defs>

  <rect width="800" height="1000" fill="#EAE5DB"/>

  <g fill="none" stroke="#4C6548" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 900V430" opacity="0.6"/>

    <g opacity="0.45">
      <use href="#hoja" transform="translate(400 780) rotate(-28)"/>
      <use href="#hoja" transform="translate(400 650) rotate(206)"/>
    </g>
  </g>

  <!-- La flor. Los cinco pétalos van en un bucle: una flor es simétrica por
       definición, y escribir los cinco ángulos a mano sería escribir la tabla
       del 72 a mano. -->
  <g fill="none" stroke="#4C6548" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <use href="#petalo" transform="translate(400 440) rotate(0)"/>
    <use href="#petalo" transform="translate(400 440) rotate(72)"/>
    <use href="#petalo" transform="translate(400 440) rotate(144)"/>
    <use href="#petalo" transform="translate(400 440) rotate(216)"/>
    <use href="#petalo" transform="translate(400 440) rotate(288)"/>
  </g>

  <circle cx="400" cy="440" r="30" fill="#6B7355" opacity="0.5"/>
</svg>
